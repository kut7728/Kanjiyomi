name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      # The bundled dictionary stays an LFS pointer here: unit tests use a stub catalog,
      # and skipping the 119 MB download keeps CI off the LFS bandwidth quota.
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Kanjiyomi.xcodeproj \
            -scheme Kanjiyomi \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:KanjiyomiTests \
            CODE_SIGNING_ALLOWED=NO
